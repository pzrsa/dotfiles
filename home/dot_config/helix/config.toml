theme = "zenwritten-dark"

[editor]
evil = true
scrolloff = 15
cursorline = true
end-of-line-diagnostics = "hint"
default-yank-register = "+"
true-color = true
idle-timeout = 0
completion-trigger-len = 1
bufferline = "always"
color-modes = true

[editor.auto-save]
focus-lost = true

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true

# [editor.cursor-shape]
# normal = "block"
# insert = "bar"

[editor.inline-diagnostics]
cursor-line = "error"

[editor.indent-guides]
render = true

[keys.normal]
S-h = "goto_previous_buffer"
S-l = "goto_next_buffer"
K = "hover"
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
esc = ["collapse_selection", "keep_primary_selection"]

[keys.normal."space"]
a = ["select_all", "select_mode"]
k = "keep_selections"
i = ":toggle lsp.display-inlay-hints"

[keys.select]
c = "change_selection"
K = "hover"
j = ["extend_line_down", "extend_to_line_bounds"]
k = ["extend_line_up", "extend_to_line_bounds"]
esc = ["collapse_selection", "normal_mode"]

[keys.select."space"]
k = "no_op"

[keys.insert]
C-space = "completion"
esc = ["collapse_selection", "normal_mode"]

[editor.statusline]
left = [
  "mode",
  "file-name",
  "read-only-indicator",
  "version-control",
  "diagnostics"
  ]
center = []
right = ["position", "position-percentage", "spinner", "file-type"]

# [editor.statusline.mode]
# insert = "INSERT"
# normal = "NORMAL"
# select = "SELECT"

[editor.soft-wrap]
enable = true

